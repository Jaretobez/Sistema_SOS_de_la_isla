<div class="modal-overlay">
    <div class="modal-content">
        
        <button id="modal-close-btn" class="modal-close-btn">&times;</button>
        <h2>Realizar Cotización</h2>

        <form id="form-cotizacion">
            
            <fieldset class="modal-fieldset">
                <legend>Cliente</legend>
                <input type="hidden" id="modal-empresa-id">
                <input type="hidden" id="modal-contacto-id">
                <div class="modal-input-group">
                    <strong>Empresa:</strong> <span id="modal-empresa-nombre"></span>
                </div>
                <div class="modal-input-group">
                    <strong>Contacto:</strong> <span id="modal-contacto-nombre"></span>
                </div>
            </fieldset>

            <fieldset class="modal-fieldset">
                <legend>Servicio de Recolección</legend>
                
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="check-recoleccion">
                        <input type="checkbox" id="check-recoleccion" data-precio="1200">
                        <strong>Incluir Servicio de Recolección ($1,200.00)</strong>
                    </label>
                </div>
                
                <div id="dias-recoleccion" class="hidden recoleccion-dias-container">
                    <p>Días de recolección (+$130.00 c/u):</p>
                    <div class="recoleccion-dias-checks">
                        <label><input type="checkbox" class="dia-check" data-precio="130" data-dia="lunes"> Lun</label>
                        <label><input type="checkbox" class="dia-check" data-precio="130" data-dia="martes"> Mar</label>
                        <label><input type="checkbox" class="dia-check" data-precio="130" data-dia="miercoles"> Mié</label>
                        <label><input type="checkbox" class="dia-check" data-precio="130" data-dia="jueves"> Jue</label>
                        <label><input type="checkbox" class="dia-check" data-precio="130" data-dia="viernes"> Vie</label>
                    </div>
                </div>

                <div id="tipo-residuo-group" class="hidden recoleccion-residuo-group">
                    <p>Tipo de Residuo:</p>
                    <div style="display:flex; gap: 20px; flex-wrap: wrap;">
                        <label>
                            <input type="radio" id="tipo-urbano" name="tipo_residuo" value="Urbano" checked>
                            Recolección de Residuos Solidos Urbanos
                        </label>
                        <label>
                            <input type="radio" id="tipo-especial" name="tipo_residuo" value="Especial">
                            Recolección de Residuo de Manejo Especial
                        </label>
                    </div>
                </div>

                <div id="bolsas-peso-group" class="hidden recoleccion-peso-group">
                    <div>
                        <label for="bolsas-dia">Cantidad de Bolsas (por día)</label>
                        <input type="number" id="bolsas-dia" value="1" min="1">
                    </div>
                    <div>
                        <label for="peso-bolsa">Peso en KG (por bolsa)</label>
                        <input type="number" id="peso-bolsa" value="1" min="1">
                    </div>
                </div>
            </fieldset>
            
            <fieldset class="modal-fieldset">
                <legend>Renta de Tolvas</legend>
                <div class="tolva-add-section">
                    <select id="select-tolva">
                        <option value="">-- Seleccionar tolva --</option>
                    </select>
                    <input type="number" id="input-tolva-qty" value="1" min="1">
                    <button type="button" id="btn-add-tolva">Agregar</button>
                </div>
                <table class="modal-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cant.</th>
                            <th>P.U.</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tolvas-tbody"></tbody>
                </table>
            </fieldset>

            <fieldset class="modal-fieldset">
                <legend>Total y Forma de Pago</legend>
                <div class="modal-input-group">
                    <label for="forma-pago">Forma de Pago</label>
                    <select id="forma-pago" class="modal-full-width-select">
                        <option value="transferencia">Transferencia</option>
                        <option value="efectivo">Efectivo</option>
                    </select>
                </div>
                <div class="total-section">
                    TOTAL: $<span id="total-cotizacion">0.00</span>
                </div>
            </fieldset>

            <button type="submit" class="btn-guardar-cotizacion">
                Guardar Cotización
            </button>
        </form>
    </div>
</div>
