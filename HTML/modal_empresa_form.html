<div id="modal-overlay-empresa" class="modal-overlay">
    <div class="modal-content">
        
        <button id="modal-close-btn" class="modal-close-btn">&times;</button>
        <h2 id="modal-titulo"></h2> 

        <form id="form-empresa-nueva">
            
            <input type="hidden" id="form-mode" value="anadir">
            <input type="hidden" id="empresa-id-edit" value="">

            <fieldset>
                <legend>Datos de la Empresa</legend>
                <div class="form-input-group">
                    <div>
                        <label for="emp-nombre-comercial">Nombre Comercial</label>
                        <input type="text" id="emp-nombre-comercial" placeholder="Ej. Bimbo" required>
                    </div>
                    <div>
                        <label for="emp-razon-social">Razón Social</label>
                        <input type="text" id="emp-razon-social" placeholder="Ej. Grupo Bimbo, S.A.B. de C.V."required>
                    </div>
                </div>
                <div class="form-input-group">
                    <div>
                        <label for="emp-tipo">Tipo</label>
                        <select id="emp-tipo">
                            <option value="empresarial">Empresarial</option>
                            <option value="comercial">Comercial</option>
                        </select>
                    </div>
                    <div>
                        <label for="emp-ruta">Ruta</label>
                        <input type="text" id="emp-ruta" placeholder="Ej. C-01">
                    </div>
                </div>
                <div>
                    <label for="emp-direccion">Dirección</label>
                    <textarea id="emp-direccion" placeholder="Ej. Azucena 71 Col, Boquerón del Palmar, 24118 Cdad. del Carmen, Camp." rows="2"></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contactos</legend>
                
                <div id="contactos-list">
                </div>
                
                <button type="button" id="btn-add-contacto">
                    <i class="fa fa-plus"></i> Añadir Otro Contacto
                </button>

            </fieldset>

            <button type="submit" id="btn-guardar-empresa">
                Guardar
            </button>
        </form>
    </div>
</div>
