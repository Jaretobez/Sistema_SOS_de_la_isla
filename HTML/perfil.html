<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../js/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Empresa</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
    <link rel="stylesheet" href="../css/perfil.css"> 
</head>
<body>

    <div class="parent">
        
        <div class="div1 card">
            
            <div class="header-left">
                <div class="profile-pic-frame"><i class="fa-solid fa-building"></i></div>
                <div class="profile-info">
                    <h1 id="perfil-nombre-comercial">Cargando...</h1>
                    <h2 id="perfil-razon-social"></h2>
                    <p><i class="fa-solid fa-calendar-alt"></i> Cliente desde: <span id="perfil-fecha-creacion">...</span></p>
                    <div class="profile-actions-left">
                        <button class="btn btn-light" id="perfil-btn-modificar"><i class="fa-solid fa-pencil"></i> Modificar</button>
                        <button class="btn btn-light" id="perfil-btn-eliminar"><i class="fa-solid fa-trash"></i> Eliminar</button>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="status-badge" id="perfil-estado-servicio">
                    <i class="fa-solid fa-spinner fa-spin"></i> </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="perfil-btn-cotizar"><i class="fa-solid fa-file-invoice-dollar"></i> Cotizar</button>
                    <button class="btn btn-danger" id="perfil-btn-cancelar" style="display: none;"><i class="fa-solid fa-ban"></i> Cancelar Servicio</button>
                </div>
                
                <div class="payment-info" id="perfil-payment-info" style="display: none;"> <p class="monto" id="perfil-monto">...</p>
                    <p id="perfil-fecha-pago">...</p>
                </div>
            </div>
        </div>
        
        <div class="div2 card">
            <div class="card-header">
                <h2><i class="fa-solid fa-address-book"></i> Contactos</h2>
                <button class="btn btn-success" id="perfil-btn-add-contacto"><i class="fa-solid fa-plus"></i> Añadir Contacto</button>
            </div>
            <ul class="contact-list" id="perfil-lista-contactos">
            </ul>
        </div>
        
        <div class="div3 card">
            <div class="card-header">
                <h2>Documentación</h2>
                <button class="btn btn-light"><i class="fa-solid fa-upload"></i></button>
            </div>
            
            <ul class="doc-list" id="perfil-lista-documentos">
            </ul>
        </div>
        
        <div class="div4 card">
            <div class="card-header">
                <h2>Horario de Cotización</h2>
            </div>
            <div id="perfil-horario-container">
            </div>
        </div>

    </div>

    <div id="modal-form-placeholder"></div>
    <div id="modal-cotizar-placeholder"></div>
    
    <script src="../app/app_perfil.js"></script>
</body>
</html>
