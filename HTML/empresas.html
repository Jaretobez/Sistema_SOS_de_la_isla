<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../js/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empresas</title>
    
    <!--RUTAS CORREGIDAS: Usan ../ para subir a la raíz 🟢 -->
    <link rel="stylesheet" href="../css/menu.css"> 
    <link rel="stylesheet" href="../css/empresas.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <nav id="sidebar-placeholder" class="sidebar"></nav>

    <!-- 🟢 WRAPPER PRINCIPAL para el efecto PUSH 🟢 -->
    <div id="main-wrapper" class="main-wrapper"> 
        
        <!-- BOTÓN DE TOGGLE reubicado dentro del wrapper -->
        <button id="btn-toggle-menu" class="menu-toggle">
            <i class="fa fa-bars"></i>
        </button>

        <main class="content">
            <div class="panel">
                <h2>Gestión de Empresas y Contactos</h2>

                <button id="btn-anadir-nuevo" class="btn-anadir">+ Añadir Nuevo</button>
                
                <form id="form-busqueda" class="form-busqueda">
                    <input type="search" id="busqueda" placeholder="Buscar empresa, contacto, email...">
                    <button type="submit">Buscar</button>
                </form>

                <table class="tabla-empresas">
                    <thead>
                        <tr>
                            <th scope="col">Nombre Comercial</th>
                            <th scope="col">Contacto Principal</th>
                            <th scope="col">Email</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    <!-- Contenido se carga aquí por JS -->
                    </tbody>
                </table>
                
                <p id="no-resultados" style="display: none; text-align: center; padding: 1rem;">
                    No hay empresas para mostrar.
                </p>
            </div>
        </main>
    </div> <!-- Cierre de #main-wrapper -->

    <div id="modal-form-placeholder"></div>
    <div id="modal-view-placeholder"></div>

    <!-- 🟢 RUTAS CORREGIDAS 🟢 -->
    <script src="../main.js"></script> 
    <script src="../app/app_empresas.js"></script> 
</body>
</html>
