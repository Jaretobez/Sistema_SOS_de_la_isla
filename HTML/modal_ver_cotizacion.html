<div class="modal-overlay">
    <div class="modal-content">
        <button id="modal-view-close-btn" class="modal-close-btn">&times;</button>
        
        <h2>Detalle de Cotización <span id="view-folio" style="color:#666; font-size:0.8em;">---</span></h2>

        <div class="detalle-grid">
            <div class="info-bloque">
                <strong>Cliente / Razón Social:</strong>
                <div id="view-cliente" class="info-valor">---</div>
            </div>
            <div class="info-bloque">
                <strong>Contacto:</strong>
                <div id="view-contacto" class="info-valor">---</div>
            </div>
            <div class="info-bloque">
                <strong>Fecha de Vencimiento:</strong>
                <div id="view-fecha" class="info-valor">---</div>
            </div>
            <div class="info-bloque">
                <strong>Forma de Pago:</strong>
                <div id="view-pago" class="info-valor">---</div>
            </div>
            <div class="info-bloque">
                <strong>Estado:</strong>
                <span id="view-estado" class="badge">---</span>
            </div>
        </div>

        <div id="view-servicio-container" class="bloque-servicio-azul" style="display:none;">
            <span id="view-servicio-nombre">Servicio de Recolección</span>
            
            <span id="view-servicio-detalle" style="font-style:italic;">---</span>
            
            <div style="margin-top:10px;">
                <span id="view-servicio-total">$0.00</span>
            </div>
        </div>

        <div class="bloque-rentas-amarillo">
            <h3 class="titulo-rentas">Renta de Equipos / Adicionales</h3>
            
            <table class="modal-table">
                <thead>
                    <tr>
                        <th style="text-align:left;">Producto / Equipo</th>
                        <th style="text-align:center;">Cant.</th>
                        <th style="text-align:right;">P. Unit.</th>
                        <th style="text-align:right;">Total</th>
                    </tr>
                </thead>
                <tbody id="view-tabla-productos">
                    </tbody>
            </table>
            
            <p id="view-no-productos" style="display:none; text-align:center; color:#a16207; margin-top:10px; font-style:italic;">
                No hay rentas ni equipos adicionales.
            </p>
        </div>

        <div class="bloque-total-verde">
            <span class="label-total-global">TOTAL GLOBAL</span>
            <span id="view-total">$0.00</span>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" id="btn-descargar-pdf" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:1rem; display:flex; align-items:center; gap:5px;">
                <i class="fa fa-file-pdf"></i> Descargar PDF
            </button>
            <button type="button" id="btn-cerrar-view" style="background:#6b7280; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:1rem;">
                Cerrar
            </button>
        </div>

    </div>
</div>
